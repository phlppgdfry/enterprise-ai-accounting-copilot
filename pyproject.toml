[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-accounting-copilot"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Synthetic invoice review, approval and transactional ERP outbox portfolio case"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3", "azure-identity>=1.19,<2", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
accounting-demo = "accounting_copilot.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
accounting_copilot = ["console.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
